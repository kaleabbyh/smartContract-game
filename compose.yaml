# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
version: '3.8'
services:
  server: 
    secrets:
      - db_url 
      - secret_key
      - pass_word
      - nextauth_secret
      - keystore  
    environment:
      DB_URL: /run/secrets/db_url
      SECRET_KEY: /run/secrets/secret_key
      NEXTAUTH_SECRET: /run/secrets/nextauth_secret
      PASSWORD: /run/secrets/pass_word
      KEYSTORE: /run/secrets/keystore
      ADMIN: "0xa44a4205019caFb1694DebcE99E72d0c67a5ec4c"
    build:
      context: .
      args:
        TARGETARCH: amd64
      target: final
    ports:
      - 8080:8080
secrets:
  db_url:
    file: ./env/db_url.txt
  secret_key:
    file: ./env/secret_key.txt
  pass_word:
    file: ./env/pass_word.txt
  nextauth_secret:
    file: ./env/nextauth_secret.txt
  keystore:
    file: ./env/keystore.txt

